<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Karthik Punati — Data Analyst & AI Builder, Bay Area" />
    <title>Karthik Punati — Portfolio</title>

    <!-- Font connections -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@300,400,500,600,700&display=swap" rel="stylesheet">

    <!-- DNS prefetch for live data APIs -->
    <link rel="dns-prefetch" href="https://earthquake.usgs.gov">
    <link rel="dns-prefetch" href="https://firms.modaps.eosdis.nasa.gov">
    <link rel="dns-prefetch" href="https://api.wheretheiss.at">

    <!-- Preload globe texture so the globe loads without a spinner delay -->
    <link rel="preload" href="earth-texture.jpg" as="image">

    <link rel="stylesheet" href="src/styles/main.css">

    <!-- Three.js — defer so it doesn't block HTML parsing -->
    <script defer crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GSAP core + ScrollTrigger — deferred, executes in document order after Three.js -->
    <script defer crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script defer crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
